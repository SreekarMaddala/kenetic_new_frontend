<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fffdf5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fff7e0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="acc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="imgBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0c0900;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="600" height="900" rx="40" fill="url(#bg)" />
  <rect x="0" y="0" width="600" height="12" rx="6" fill="url(#acc)" />

  <!-- Clip hole -->
  <rect x="262" y="26" width="76" height="30" rx="15" fill="#ddc890" />
  <rect x="274" y="32" width="52" height="18" rx="9" fill="#c8ac70" />

  <!-- ── Steel rebar image block ── -->
  <rect x="40" y="76" width="520" height="300" rx="24" fill="url(#imgBg)" />

  <!-- Rebar stack illustration -->
  <rect x="40" y="120" width="520" height="18" rx="4" fill="#5c3a0a" opacity="0.95"/>
  <rect x="40" y="145" width="520" height="18" rx="4" fill="#482e08" opacity="0.9"/>
  <rect x="40" y="170" width="520" height="18" rx="4" fill="#5c3a0a" opacity="0.95"/>
  <rect x="40" y="195" width="520" height="18" rx="4" fill="#3e2606" opacity="0.9"/>
  <rect x="40" y="220" width="520" height="18" rx="4" fill="#5c3a0a" opacity="0.95"/>
  <rect x="40" y="245" width="520" height="18" rx="4" fill="#482e08" opacity="0.9"/>
  <rect x="40" y="270" width="520" height="18" rx="4" fill="#5c3a0a" opacity="0.9"/>
  <rect x="40" y="295" width="520" height="18" rx="4" fill="#482e08" opacity="0.85"/>
  <!-- Sheen highlight on each rebar -->
  <rect x="40" y="120" width="520" height="5" rx="2" fill="#c87020" opacity="0.3"/>
  <rect x="40" y="145" width="520" height="5" rx="2" fill="#b86010" opacity="0.25"/>
  <rect x="40" y="170" width="520" height="5" rx="2" fill="#c87020" opacity="0.3"/>
  <rect x="40" y="195" width="520" height="5" rx="2" fill="#b86010" opacity="0.25"/>
  <rect x="40" y="220" width="520" height="5" rx="2" fill="#c87020" opacity="0.3"/>
  <rect x="40" y="245" width="520" height="5" rx="2" fill="#b86010" opacity="0.25"/>
  <rect x="40" y="270" width="520" height="5" rx="2" fill="#c87020" opacity="0.28"/>
  <rect x="40" y="295" width="520" height="5" rx="2" fill="#b86010" opacity="0.22"/>
  <!-- Alert overlay badge -->
  <rect x="372" y="88" width="176" height="34" rx="17" fill="#f59e0b" opacity="0.18"/>
  <rect x="372" y="88" width="176" height="34" rx="17" fill="none" stroke="#f59e0b" stroke-width="2" opacity="0.6"/>
  <circle cx="390" cy="105" r="7" fill="#f59e0b"/>
  <text x="402" y="111" font-family="monospace" font-size="15" font-weight="700" fill="#d97706">REORDER ALERT</text>

  <!-- TAG -->
  <rect x="40" y="396" width="140" height="34" rx="17" fill="#f59e0b" opacity="0.12"/>
  <rect x="40" y="396" width="140" height="34" rx="17" fill="none" stroke="#f59e0b" stroke-width="2" opacity="0.5"/>
  <text x="110" y="419" font-family="Arial, sans-serif" font-size="15" font-weight="800" fill="#d97706" text-anchor="middle" letter-spacing="2">INVENTORY</text>

  <!-- BIG TITLE -->
  <text x="40" y="510" font-family="Arial Black, Arial, sans-serif" font-size="78" font-weight="900" fill="#1a0e00" letter-spacing="-2">Material</text>
  <text x="40" y="598" font-family="Arial Black, Arial, sans-serif" font-size="78" font-weight="900" fill="#1a0e00" letter-spacing="-2">Intelli-</text>
  <text x="40" y="686" font-family="Arial Black, Arial, sans-serif" font-size="78" font-weight="900" fill="#d97706" letter-spacing="-2">gence</text>

  <!-- Stat pill -->
  <rect x="40" y="716" width="520" height="2" rx="1" fill="#ddc890" opacity="0.6"/>
  <text x="40" y="760" font-family="monospace" font-size="18" fill="#7a5010" letter-spacing="1">500+ SKUs  ·  0 SHORTAGES</text>

  <!-- Bottom accent -->
  <rect x="0" y="888" width="600" height="12" rx="6" fill="url(#acc)" />
</svg>
