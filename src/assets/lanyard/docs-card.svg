  <rect x="40" y="396" width="100" height="34" rx="17" fill="#3b82f6" opacity="0.12"/>
  <rect x="40" y="396" width="100" height="34" rx="17" fill="none" stroke="#3b82f6" stroke-width="2" opacity="0.5"/>
  <text x="90" y="419" font-family="Arial, sans-serif" font-size="15" font-weight="800" fill="#1d5fe0" text-anchor="middle" letter-spacing="2">DOCS</text>

  <!-- BIG TITLE -->
  <text x="40" y="510" font-family="Arial Black, Arial, sans-serif" font-size="78" font-weight="900" fill="#071226" letter-spacing="-2">Document</text>
  <text x="40" y="598" font-family="Arial Black, Arial, sans-serif" font-size="78" font-weight="900" fill="#071226" letter-spacing="-2">Reposi-</text>
  <text x="40" y="686" font-family="Arial Black, Arial, sans-serif" font-size="78" font-weight="900" fill="#1d5fe0" letter-spacing="-2">tory</text>

