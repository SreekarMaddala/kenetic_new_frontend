<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5f8ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#eaf0ff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="acc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d5fe0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="imgBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8faff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#eef4ff;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="600" height="900" rx="40" fill="url(#bg)" />
  <rect x="0" y="0" width="600" height="12" rx="6" fill="url(#acc)" />

  <!-- Clip hole -->
