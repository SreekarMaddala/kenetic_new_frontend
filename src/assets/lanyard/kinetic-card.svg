  <rect x="185" y="522" width="120" height="28" rx="14" fill="none" stroke="#f97316" stroke-width="1.5" opacity="0.5"/>
  <text x="245" y="541" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#ea580c" text-anchor="middle" letter-spacing="1">KENETIC OPS</text>

