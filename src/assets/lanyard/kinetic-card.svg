  <rect x="280" y="148" width="44" height="9" rx="2.5" fill="white" opacity="0.75"/>
  <rect x="314" y="153" width="14" height="6" rx="2" fill="white" opacity="0.45"/>
  <line x1="286" y1="157" x2="286" y2="200" stroke="white" stroke-width="2" opacity="0.5" stroke-dasharray="3,2"/>

