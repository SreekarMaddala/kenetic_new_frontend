  <text x="152" y="732" font-family="monospace" font-size="13" fill="#1a100f" opacity="0.4">ID: KNT-2025-0042</text>
  <text x="152" y="752" font-family="monospace" font-size="13" fill="#1a100f" opacity="0.4">kenetic.app/dashboard</text>
  <text x="152" y="772" font-family="monospace" font-size="13" fill="#ea580c" opacity="0.8">● Active</text>

