  <!-- Building icon inside logo -->
  <rect x="248" y="200" width="40" height="56" rx="3" fill="white" opacity="0.95"/>
  <rect x="254" y="184" width="28" height="20" rx="2" fill="white" opacity="0.75"/>
  <rect x="250" y="208" width="10" height="10" rx="1.5" fill="#ea580c" opacity="0.7"/>
