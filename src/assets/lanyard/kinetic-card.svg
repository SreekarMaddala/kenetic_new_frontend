  <rect x="60" y="710" width="68" height="68" rx="8" fill="#1a100f" opacity="0.06"/>
  <rect x="66" y="716" width="16" height="16" rx="2" fill="#1a100f" opacity="0.35"/>
  <rect x="86" y="716" width="8" height="8" rx="1" fill="#1a100f" opacity="0.2"/>
  <rect x="98" y="716" width="16" height="16" rx="2" fill="#1a100f" opacity="0.35"/>
  <rect x="66" y="736" width="8" height="8" rx="1" fill="#1a100f" opacity="0.2"/>
  <rect x="80" y="736" width="12" height="8" rx="1" fill="#1a100f" opacity="0.15"/>
  <rect x="98" y="736" width="16" height="8" rx="1" fill="#1a100f" opacity="0.2"/>
  <rect x="66" y="748" width="16" height="16" rx="2" fill="#1a100f" opacity="0.35"/>
  <rect x="86" y="748" width="8" height="8" rx="1" fill="#1a100f" opacity="0.15"/>
  <rect x="98" y="748" width="16" height="16" rx="2" fill="#1a100f" opacity="0.35"/>

