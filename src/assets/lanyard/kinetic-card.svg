  <text x="120" y="654" font-family="Arial, sans-serif" font-size="12" fill="#90807a" text-anchor="middle" letter-spacing="1">PROJECTS</text>

  <text x="300" y="630" font-family="Arial, sans-serif" font-size="32" font-weight="800" fill="#1a100f" text-anchor="middle">₹655Cr</text>
  <text x="300" y="654" font-family="Arial, sans-serif" font-size="12" fill="#90807a" text-anchor="middle" letter-spacing="1">MANAGED</text>

  <text x="480" y="630" font-family="Arial, sans-serif" font-size="32" font-weight="800" fill="#1a100f" text-anchor="middle">98.2%</text>
  <text x="480" y="654" font-family="Arial, sans-serif" font-size="12" fill="#90807a" text-anchor="middle" letter-spacing="1">AI ACCURACY</text>

  <!-- Divider 3 -->
  <rect x="60" y="676" width="480" height="1" rx="1" fill="#dbd2d0" />

