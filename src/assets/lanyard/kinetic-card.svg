  <text x="185" y="478" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#1a100f">Arun Reddy</text>
  <text x="185" y="506" font-family="Arial, sans-serif" font-size="17" fill="#70605a">Founder & CEO</text>

  <!-- Company badge -->
