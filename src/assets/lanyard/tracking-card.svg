<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fffaf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fff2e8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="acc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f97316;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ea580c;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="imgBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#20100a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#150a05;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Card background -->
  <rect width="600" height="900" rx="40" fill="url(#bg)" />

  <!-- Top accent bar -->
  <rect x="0" y="0" width="600" height="12" rx="6" fill="url(#acc)" />

  <!-- Clip hole -->
  <rect x="262" y="26" width="76" height="30" rx="15" fill="#d4c4b8" />
  <rect x="274" y="32" width="52" height="18" rx="9" fill="#bcac9a" />

  <!-- ── Small image block ── -->
  <rect x="40" y="76" width="520" height="300" rx="24" fill="url(#imgBg)" />

  <!-- Crane silhouette illustration -->
  <!-- Sky glow -->
  <ellipse cx="300" cy="220" rx="180" ry="100" fill="#f97316" opacity="0.08"/>
  <!-- Ground -->
  <rect x="40" y="330" width="520" height="46" rx="0" fill="#100804" opacity="0.95"/>
  <!-- Building body -->
  <rect x="180" y="190" width="90" height="150" rx="6" fill="#2e1a0d" opacity="0.95"/>
  <rect x="200" y="210" width="20" height="22" rx="3" fill="#f97316" opacity="0.3"/>
  <rect x="230" y="210" width="20" height="22" rx="3" fill="#f97316" opacity="0.2"/>
  <rect x="200" y="244" width="20" height="22" rx="3" fill="#f97316" opacity="0.2"/>
  <rect x="230" y="244" width="20" height="22" rx="3" fill="#f97316" opacity="0.15"/>
  <rect x="200" y="278" width="20" height="22" rx="3" fill="#f97316" opacity="0.15"/>
  <rect x="230" y="278" width="20" height="22" rx="3" fill="#f97316" opacity="0.1"/>
  <!-- Crane tower -->
  <rect x="350" y="120" width="18" height="220" rx="5" fill="#f97316" opacity="0.6"/>
  <!-- Crane arm -->
  <rect x="260" y="120" width="140" height="16" rx="5" fill="#f97316" opacity="0.5"/>
  <!-- Counterweight -->
  <rect x="390" y="126" width="28" height="10" rx="3" fill="#f97316" opacity="0.3"/>
  <!-- Cable -->
  <line x1="278" y1="136" x2="278" y2="195" stroke="#f97316" stroke-width="2.5" opacity="0.4" stroke-dasharray="5,4"/>
  <!-- Hook -->
  <path d="M268 195 Q262 210 272 210 Q280 210 277 200" stroke="#f97316" stroke-width="2.5" fill="none" opacity="0.5" stroke-linecap="round"/>
  <!-- Live dot -->
  <circle cx="490" cy="102" r="8" fill="#f97316"/>
  <circle cx="490" cy="102" r="14" fill="#f97316" opacity="0.2"/>
  <text x="508" y="108" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#f97316">LIVE</text>

  <!-- TAG -->
  <rect x="40" y="396" width="140" height="34" rx="17" fill="#f97316" opacity="0.12"/>
  <rect x="40" y="396" width="140" height="34" rx="17" fill="none" stroke="#f97316" stroke-width="2" opacity="0.5"/>
  <text x="110" y="419" font-family="Arial, sans-serif" font-size="15" font-weight="800" fill="#ea580c" text-anchor="middle" letter-spacing="2">TRACKING</text>

  <!-- BIG TITLE -->
  <text x="40" y="510" font-family="Arial Black, Arial, sans-serif" font-size="78" font-weight="900" fill="#071a0e" letter-spacing="-2">Live</text>
  <text x="40" y="598" font-family="Arial Black, Arial, sans-serif" font-size="78" font-weight="900" fill="#071a0e" letter-spacing="-2">Project</text>
  <text x="40" y="686" font-family="Arial Black, Arial, sans-serif" font-size="78" font-weight="900" fill="#00b86e" letter-spacing="-2">Pipeline</text>

  <!-- Stat pill -->
  <rect x="40" y="716" width="520" height="2" rx="1" fill="#b8d4c4" opacity="0.6"/>
  <text x="40" y="760" font-family="monospace" font-size="18" fill="#3a6050" letter-spacing="1">14+ SITES  ·  ₹655Cr MANAGED</text>

  <!-- Bottom accent -->
  <rect x="0" y="888" width="600" height="12" rx="6" fill="url(#acc)" />
</svg>
