<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5f8ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8eeff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="acc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b9ef5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a7de8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="imgBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f5ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0eaff;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Card background -->
  <rect width="600" height="900" rx="40" fill="url(#bg)" />
  <rect x="0" y="0" width="600" height="12" rx="6" fill="url(#acc)" />

  <!-- Clip hole -->
  <rect x="262" y="26" width="76" height="30" rx="15" fill="#b0c4ee" />
  <rect x="274" y="32" width="52" height="18" rx="9" fill="#90a8dc" />

  <!-- ── Small image: invoice document illustration ── -->
  <rect x="40" y="76" width="520" height="300" rx="24" fill="url(#imgBg)" />

  <!-- Document sheet -->
  <rect x="120" y="110" width="360" height="260" rx="12" fill="white" opacity="0.9"/>
  <rect x="120" y="110" width="360" height="260" rx="12" fill="none" stroke="#3b9ef5" stroke-width="2" opacity="0.2"/>
  <!-- Doc header bar -->
  <rect x="120" y="110" width="360" height="40" rx="12" fill="#3b9ef5" opacity="0.08"/>
  <rect x="140" y="122" width="200" height="16" rx="4" fill="#1a7de8" opacity="0.2"/>
  <rect x="360" y="124" width="80" height="12" rx="3" fill="#1a7de8" opacity="0.15"/>
  <!-- Table lines -->
  <rect x="136" y="166" width="328" height="2" fill="#3b9ef5" opacity="0.15"/>
  <rect x="136" y="172" width="120" height="12" rx="3" fill="#1a7de8" opacity="0.2"/>
  <rect x="276" y="172" width="60" height="12" rx="3" fill="#1a7de8" opacity="0.15"/>
  <rect x="356" y="172" width="60" height="12" rx="3" fill="#1a7de8" opacity="0.15"/>
  <rect x="136" y="196" width="108" height="10" rx="3" fill="#0a1a2f" opacity="0.15"/>
  <rect x="276" y="196" width="50" height="10" rx="3" fill="#0a1a2f" opacity="0.1"/>
  <rect x="356" y="196" width="60" height="10" rx="3" fill="#0a1a2f" opacity="0.12"/>
  <rect x="136" y="216" width="118" height="10" rx="3" fill="#0a1a2f" opacity="0.12"/>
  <rect x="276" y="216" width="44" height="10" rx="3" fill="#0a1a2f" opacity="0.1"/>
  <rect x="356" y="216" width="60" height="10" rx="3" fill="#0a1a2f" opacity="0.1"/>
  <rect x="136" y="236" width="100" height="10" rx="3" fill="#0a1a2f" opacity="0.1"/>
  <rect x="276" y="236" width="48" height="10" rx="3" fill="#0a1a2f" opacity="0.08"/>
  <rect x="356" y="236" width="60" height="10" rx="3" fill="#0a1a2f" opacity="0.08"/>
  <!-- Total highlight -->
  <rect x="128" y="258" width="340" height="30" rx="8" fill="#3b9ef5" opacity="0.12"/>
  <rect x="140" y="266" width="80" height="14" rx="3" fill="#1a7de8" opacity="0.35"/>
  <rect x="360" y="266" width="80" height="14" rx="3" fill="#1a7de8" opacity="0.5"/>
  <!-- AI badge -->
  <rect x="364" y="310" width="96" height="28" rx="14" fill="#3b9ef5" opacity="0.15"/>
  <rect x="364" y="310" width="96" height="28" rx="14" fill="none" stroke="#3b9ef5" stroke-width="1.5" opacity="0.5"/>
  <text x="412" y="329" font-family="monospace" font-size="14" font-weight="700" fill="#1a7de8" text-anchor="middle">98.2%</text>

  <!-- TAG -->
  <rect x="40" y="396" width="124" height="34" rx="17" fill="#3b9ef5" opacity="0.12"/>
  <rect x="40" y="396" width="124" height="34" rx="17" fill="none" stroke="#3b9ef5" stroke-width="2" opacity="0.5"/>
  <text x="102" y="419" font-family="Arial, sans-serif" font-size="15" font-weight="800" fill="#1a7de8" text-anchor="middle" letter-spacing="2">FINANCE</text>

  <!-- BIG TITLE -->
  <text x="40" y="510" font-family="Arial Black, Arial, sans-serif" font-size="78" font-weight="900" fill="#071226" letter-spacing="-2">AI Bill</text>
  <text x="40" y="598" font-family="Arial Black, Arial, sans-serif" font-size="78" font-weight="900" fill="#071226" letter-spacing="-2">Extra-</text>
  <text x="40" y="686" font-family="Arial Black, Arial, sans-serif" font-size="78" font-weight="900" fill="#1a7de8" letter-spacing="-2">ction</text>

  <!-- Stat pill -->
  <rect x="40" y="716" width="520" height="2" rx="1" fill="#b0c4ee" opacity="0.6"/>
  <text x="40" y="760" font-family="monospace" font-size="18" fill="#2a4070" letter-spacing="1">98.2% ACCURACY  ·  42 VENDORS</text>

  <!-- Bottom accent -->
  <rect x="0" y="888" width="600" height="12" rx="6" fill="url(#acc)" />
</svg>
